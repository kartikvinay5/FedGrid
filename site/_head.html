<title>FedGrid</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: an engineering report. A marginal rail carries the paper's own section numbers; the hero pairs the title with a live single-line diagram of the six-zone grid.
   Color encodes the system: amber = load data that never leaves a zone, blue = model weights that travel. */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --ink:#121922; --ink-2:#4D5868; --ink-3:#7C8796; --rule:#D3D9E1;
  --load:#B86E00; --load-soft:rgba(184,110,0,.14);
  --model:#1F4FC4; --model-soft:rgba(31,79,196,.12);
  --bar:#B9C2CE; --bar-2:#8B97A7;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --measure:66ch;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1218; --surface:#141B24; --ink:#E5EAF1; --ink-2:#A1ACBB; --ink-3:#6F7B8B; --rule:#263140;
  --load:#F0A63A; --load-soft:rgba(240,166,58,.16);
  --model:#7FA3FF; --model-soft:rgba(127,163,255,.14);
  --bar:#3A4656; --bar-2:#56647A; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D1218; --surface:#141B24; --ink:#E5EAF1; --ink-2:#A1ACBB; --ink-3:#6F7B8B; --rule:#263140;
  --load:#F0A63A; --load-soft:rgba(240,166,58,.16);
  --model:#7FA3FF; --model-soft:rgba(127,163,255,.14);
  --bar:#3A4656; --bar-2:#56647A; color-scheme:dark }

*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:var(--model);text-underline-offset:3px}
a:focus-visible,button:focus-visible{outline:2px solid var(--model);outline-offset:3px;border-radius:3px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono)}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.bar .wrap{display:flex;align-items:center;gap:24px;min-height:52px}
.brand{font-family:var(--f-display);font-weight:800;font-stretch:115%;font-size:17px;letter-spacing:.01em;text-decoration:none;color:var(--ink);white-space:nowrap}
.brand b{color:var(--model);font-weight:800}
.nav{display:flex;gap:20px;overflow-x:auto;scrollbar-width:none;min-width:0;margin-left:auto}
.nav::-webkit-scrollbar{display:none}
.nav a{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);text-decoration:none;white-space:nowrap;padding-block:14px}
.nav a:hover{color:var(--ink)}

/* hero */
.hero{padding-block:56px 40px}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:48px;align-items:center}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:6px 14px}
.eyebrow span+span::before{content:"/";margin-right:14px;color:var(--ink-3)}
.wordmark{font-family:var(--f-display);font-weight:900;font-stretch:125%;font-size:clamp(56px,9vw,112px);line-height:.88;letter-spacing:-.02em;margin:18px 0 18px}
.wordmark .g{color:var(--model)}
h1.paper-title{font-family:var(--f-display);font-weight:600;font-stretch:88%;font-size:clamp(21px,2.3vw,27px);line-height:1.22;margin:0 0 20px;text-wrap:balance;max-width:34ch}
.thesis{font-size:19px;color:var(--ink-2);max-width:48ch;margin:0 0 26px}
.authors{display:flex;flex-wrap:wrap;gap:4px 22px;font-family:var(--f-display);font-stretch:95%;font-weight:600;font-size:16px}
.authors .me{color:var(--ink)}
.affil{font-size:15px;color:var(--ink-2);margin:6px 0 0}
.status{display:inline-flex;align-items:center;gap:8px;margin-top:22px;font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;border:1px solid var(--rule);background:var(--surface);padding:6px 10px;border-radius:999px;color:var(--ink-2)}
.status i{width:7px;height:7px;border-radius:50%;background:var(--load);display:block}

/* diagram */
.diagram{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:14px 14px 10px;min-width:0}
.diagram-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);padding:0 4px 6px}
.diagram svg{display:block;width:100%;height:auto;max-width:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2);padding:8px 4px 2px;border-top:1px solid var(--rule);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.sw{width:18px;height:0;border-top:2px solid}
.sw.edge{border-color:var(--bar-2)}
.sw.up{border-top:2px dashed var(--model)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.dot.l{background:var(--load)} .dot.m{background:var(--model)}
svg .edge{stroke:var(--bar-2);stroke-width:2.2}
svg .spoke{stroke:var(--model);stroke-width:1.2;stroke-dasharray:3 5;opacity:.45}
svg .node{fill:var(--surface);stroke:var(--ink);stroke-width:1.6}
svg .ring{fill:none;stroke:var(--load);stroke-width:3}
svg .halo{fill:var(--load)}
svg .nlabel{fill:var(--ink);font-family:var(--f-mono);font-size:13px;font-weight:600}
svg .ntype{fill:var(--ink-3);font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em}
svg .agg{fill:var(--model-soft);stroke:var(--model);stroke-width:1.6}
svg .aggt{fill:var(--model);font-family:var(--f-mono);font-size:12px;font-weight:600}
svg .aggs{fill:var(--ink-2);font-family:var(--f-mono);font-size:10.5px}
svg .pkt{fill:var(--model)}

/* spec strip */
.spec{border-block:1px solid var(--rule);background:var(--surface)}
.spec .wrap{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0}
.spec .wrap>div{padding:18px 16px 16px;border-left:1px solid var(--rule)}
.spec .wrap>div:first-child{border-left:0;padding-left:0}
.spec dt{font-family:var(--f-mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.spec dd{margin:0;font-family:var(--f-display);font-stretch:105%;font-weight:700;font-size:22px;line-height:1.15}
.spec dd small{display:block;font-family:var(--f-body);font-weight:400;font-size:14px;color:var(--ink-2);font-stretch:100%;margin-top:2px}
.spec .hl dd{color:var(--model)}

/* sections */
section.s{padding-block:72px 8px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 40px)}
.s .wrap{display:grid;grid-template-columns:150px minmax(0,1fr);gap:40px}
.rail{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding-top:10px;border-top:2px solid var(--ink);align-self:start}
.rail b{display:block;font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:30px;color:var(--ink);letter-spacing:0;line-height:1;margin-bottom:6px}
.body{min-width:0}
h2{font-family:var(--f-display);font-weight:800;font-stretch:108%;font-size:clamp(28px,3.4vw,40px);line-height:1.08;letter-spacing:-.01em;margin:0 0 18px;text-wrap:balance;max-width:24ch}
h3{font-family:var(--f-display);font-weight:700;font-stretch:100%;font-size:19px;margin:0 0 8px}
p{margin:0 0 16px;max-width:var(--measure)}
.lede{font-size:20px;color:var(--ink-2)}
.cite{font-family:var(--f-mono);font-size:.72em;color:var(--model);vertical-align:.25em;text-decoration:none}

/* properties */
.props{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--rule);background:var(--surface);border-radius:6px;margin:28px 0 30px}
.props div{padding:20px 20px 18px;border-left:1px solid var(--rule);min-width:0}
.props div:first-child{border-left:0}
.props .k{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.props h3{margin-top:6px}
.props p{font-size:16px;color:var(--ink-2);margin:0}

/* tables */
.tscroll{overflow-x:auto;border:1px solid var(--rule);border-radius:6px;background:var(--surface);margin:8px 0 10px}
table{border-collapse:collapse;width:100%;font-size:15.5px}
th,td{padding:11px 16px;text-align:left;border-bottom:1px solid var(--rule);white-space:nowrap}
tr:last-child td{border-bottom:0}
thead th{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:500;background:var(--bg)}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:14.5px}
tr.ours td{background:var(--model-soft)}
tr.ours td:first-child{font-weight:600;color:var(--ink)}
.mk{font-family:var(--f-mono);font-size:16px;text-align:center !important}
.mk.y{color:var(--model)} .mk.n{color:var(--ink-3)}
.caption{font-size:14px;color:var(--ink-3);font-style:italic;margin:0 0 8px}

/* problem */
.formal{border-left:3px solid var(--model);padding:4px 0 4px 20px;margin:24px 0;max-width:var(--measure)}
.formal p{margin:0 0 10px;font-size:17px}
.math{font-family:var(--f-body);font-style:italic}
.goals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:10px}
.goal{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:16px 18px}
.goal .k{font-family:var(--f-mono);font-size:12px;color:var(--model);font-weight:600}
.goal p{font-size:16px;margin:6px 0 0;color:var(--ink-2)}

/* pipeline */
.pipe{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:26px 0 22px;counter-reset:layer}
.layer{position:relative;background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:18px 18px 16px;min-width:0}
.layer .file{font-family:var(--f-mono);font-size:12.5px;color:var(--model);background:var(--model-soft);padding:2px 7px;border-radius:3px;display:inline-block;margin-bottom:10px}
.layer ul{margin:8px 0 0;padding-left:18px;font-size:15.5px;color:var(--ink-2)}
.layer li{margin-bottom:4px}
.layer:not(:last-child)::after{content:"";position:absolute;right:-12px;top:34px;width:10px;height:10px;border-top:2px solid var(--ink-3);border-right:2px solid var(--ink-3);transform:rotate(45deg);z-index:1;background:transparent}
.outputs{font-family:var(--f-mono);font-size:13px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.outputs code{border:1px solid var(--rule);background:var(--surface);padding:3px 8px;border-radius:3px;color:var(--ink)}
.setup{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 32px;margin:28px 0 8px;max-width:820px}
.setup div{display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid var(--rule);padding:10px 0;font-size:16px;min-width:0}
.setup span:first-child{color:var(--ink-2)}
.setup span:last-child{font-family:var(--f-mono);font-size:14px;text-align:right}

/* charts */
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:20px 20px 16px;margin:20px 0 14px;min-width:0}
.panel-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.panel-head h3{margin:0}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:5px;overflow:hidden;flex-wrap:wrap}
.seg button{font:500 12.5px var(--f-mono);letter-spacing:.03em;background:transparent;color:var(--ink-2);border:0;border-left:1px solid var(--rule);padding:7px 12px;cursor:pointer}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.hbar{display:grid;grid-template-columns:minmax(120px,210px) minmax(0,1fr);gap:10px 14px;align-items:center}
.hbar .lab{font-size:15px;line-height:1.25;min-width:0}
.hbar .lab small{display:block;font-family:var(--f-mono);font-size:11px;color:var(--ink-3);letter-spacing:.03em}
.track{position:relative;height:26px;min-width:0}
.fill{position:absolute;left:0;top:3px;bottom:3px;background:var(--bar);border-radius:0 2px 2px 0;transition:width .5s cubic-bezier(.3,.7,.2,1)}
.fill.fed{background:var(--bar-2)}
.fill.ours{background:var(--model)}
.fill.surge{background:var(--load)}
.val{position:absolute;top:50%;transform:translateY(-50%);font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--ink);padding-left:8px;white-space:nowrap;transition:left .5s cubic-bezier(.3,.7,.2,1)}
.axis{position:relative;height:22px;margin-top:6px;border-top:1px solid var(--rule)}
.axis span{position:absolute;top:4px;transform:translateX(-50%);font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.gridl{position:absolute;top:0;bottom:0;width:1px;background:var(--rule);opacity:.7}
@media (prefers-reduced-motion: reduce){.fill,.val{transition:none}}
.deltas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-top:1px solid var(--rule);margin-top:16px;padding-top:4px}
.deltas>div{padding:12px 14px 4px 0;min-width:0}
.deltas .k{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.deltas .v{font-family:var(--f-display);font-stretch:105%;font-weight:700;font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums}
.deltas .v.good{color:var(--model)} .deltas .v.bad{color:var(--load)}
.deltas .d{font-size:14px;color:var(--ink-2)}
.note{font-size:15px;color:var(--ink-2);max-width:var(--measure)}
.feat-key{display:inline-flex;gap:16px;flex-wrap:wrap;font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2);margin-top:12px}
.feat-key span{display:inline-flex;align-items:center;gap:6px}
.feat-key i{width:12px;height:8px;display:inline-block}

/* roadmap */
.road{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:24px}
.road .col{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:18px 20px;min-width:0}
.road ul{list-style:none;margin:10px 0 0;padding:0}
.road li{display:flex;gap:12px;align-items:baseline;padding:9px 0;border-top:1px solid var(--rule);font-size:16px}
.road li:first-child{border-top:0}
.chip{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:3px;white-space:nowrap;flex:none}
.chip.done{background:var(--model-soft);color:var(--model)}
.chip.next{background:var(--load-soft);color:var(--load)}

/* cite */
.bib{position:relative;background:var(--surface);border:1px solid var(--rule);border-radius:6px;margin:18px 0 8px;max-width:820px}
.bib pre{margin:0;padding:18px 20px;overflow-x:auto;font-family:var(--f-mono);font-size:13px;line-height:1.6;color:var(--ink)}
.copy{position:absolute;top:10px;right:10px;font:500 12px var(--f-mono);background:var(--bg);color:var(--ink);border:1px solid var(--rule);border-radius:4px;padding:5px 10px;cursor:pointer}
.team{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:24px 0 10px}
.team div{border-top:2px solid var(--ink);padding-top:12px}
.team b{font-family:var(--f-display);font-weight:700;font-size:18px;display:block}
.team span{font-size:15px;color:var(--ink-2)}
.refs{list-style:none;padding:0;margin:18px 0 0;max-width:880px;counter-reset:r}
.refs li{display:grid;grid-template-columns:42px minmax(0,1fr);gap:8px;font-size:15px;color:var(--ink-2);padding:9px 0;border-top:1px solid var(--rule);line-height:1.5}
.refs li::before{counter-increment:r;content:"[" counter(r) "]";font-family:var(--f-mono);font-size:13px;color:var(--ink-3);padding-top:1px}
.refs a{word-break:break-all}

footer{margin-top:80px;border-top:1px solid var(--rule);padding-block:28px 40px;font-size:14px;color:var(--ink-3)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px}

/* responsive */
@media (max-width:980px){
  .hero .wrap{grid-template-columns:minmax(0,1fr);gap:32px}
  .spec .wrap{grid-template-columns:repeat(3,minmax(0,1fr))}
  .spec .wrap>div:nth-child(4){border-left:0;padding-left:0}
  .spec .wrap>div:nth-child(n+4){border-top:1px solid var(--rule)}
  .s .wrap{grid-template-columns:minmax(0,1fr);gap:18px}
  .rail{display:flex;align-items:baseline;gap:12px}
  .rail b{font-size:22px;margin:0}
}
@media (max-width:720px){
  body{font-size:17px}
  .props,.pipe,.goals,.road,.team,.setup{grid-template-columns:minmax(0,1fr)}
  .props div{border-left:0;border-top:1px solid var(--rule)}
  .props div:first-child{border-top:0}
  .layer:not(:last-child)::after{right:auto;left:28px;top:auto;bottom:-12px;transform:rotate(135deg)}
  .spec .wrap{grid-template-columns:repeat(2,minmax(0,1fr))}
  .spec .wrap>div{border-left:0;padding-left:0;border-top:1px solid var(--rule)}
  .spec .wrap>div:nth-child(-n+2){border-top:0}
  .spec .wrap>div:nth-child(even){padding-left:16px;border-left:1px solid var(--rule)}
  .deltas{grid-template-columns:minmax(0,1fr)}
  .hbar{grid-template-columns:minmax(0,1fr);gap:2px}
  .hbar .track{margin-bottom:8px}
  section.s{padding-block:56px 4px}
}
</style>
